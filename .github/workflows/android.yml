name: Android foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: Run Compose tests on an Android emulator (no native encoding)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile, test and lint the no-native application
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
      - name: No-native preview APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forma-no-native-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-check-reports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore
  native-api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit-next
          ref: 5e51b2da4c3593c0f2f9b49f53eeb497d93e39d3
          path: vendor/ffmpeg-kit-next
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-34' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile upstream Kotlin API only (no native binaries)
        run: ./gradlew -p vendor/ffmpeg-kit-next/android :ffmpeg-kit-next-android-lib:assembleRelease --stacktrace
      - name: Stage API-only Maven artifact for compile checking
        shell: bash
        run: |
          set -euo pipefail
          repo="$PWD/local-native/com/arthenica/ffmpeg-kit-next/9.0.0"
          mkdir -p "$repo"
          mapfile -t aars < <(find vendor/ffmpeg-kit-next/android/ffmpeg-kit-next-android-lib/build/outputs/aar -name '*release.aar')
          test "${#aars[@]}" -eq 1
          cp "${aars[0]}" "$repo/ffmpeg-kit-next-9.0.0.aar"
          cat > "$repo/ffmpeg-kit-next-9.0.0.pom" <<'POM'
          <project><modelVersion>4.0.0</modelVersion><groupId>com.arthenica</groupId><artifactId>ffmpeg-kit-next</artifactId><version>9.0.0</version><packaging>aar</packaging><dependencies><dependency><groupId>com.arthenica</groupId><artifactId>smart-exception-java</artifactId><version>0.2.1</version></dependency></dependencies></project>
          POM
      - name: Compile the optional adapter against the real API
        run: ./gradlew -PffmpegEnabled=true -PffmpegRepo="$PWD/local-native" :engine-ffmpeg:compileDebugKotlin :app:compileDebugKotlin --stacktrace
      # Never upload this API-only AAR/APK as a usable encoder.
  compose-device:
    if: github.event_name == 'workflow_dispatch' && inputs.run_device_tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-device-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
